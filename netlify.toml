[build]
  publish = "."

[[plugins]]
  package = "netlify-plugin-checklinks"

  [plugins.inputs]
    skipPatterns = ["https://fonts.googleapis.com", "https://fonts.gstatic.com"]

# ─── Redirect: www → non-www (SEO canonical fix) ───────────────────────────
[[redirects]]
  from = "https://www.omodajaecoopalembang.web.id/*"
  to   = "https://omodajaecoopalembang.web.id/:splat"
  status = 301
  force  = true

# ─── Cache: images, fonts, static assets ────────────────────────────────────
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/jaecoo-j7-sivp/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ─── CMS admin — jangan di-cache lama ───────────────────────────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ─── Content config (images.yml) — jangan di-cache ──────────────────────────
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
