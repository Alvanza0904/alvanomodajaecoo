<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Admin — OMODA JAECOO Palembang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/cms-mobile.css?v=3" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 14px; -webkit-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    #cms-shell {
      position: fixed; inset: 0; background: #0a0a0a;
      display: flex; flex-direction: column; z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #cms-shell.hidden { opacity: 0; pointer-events: none; z-index: -1; }
    .shell-bar {
      height: 48px; background: #0a0a0a; border-bottom: 1px solid #1e1e1e;
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
    }
    .shell-logo {
      width: 24px; height: 24px; border-radius: 5px;
      background: linear-gradient(135deg,#c9a84c,#e8c97a);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #0a0a0a;
    }
    .shell-name { font-size: 13px; font-weight: 600; color: #f0f0f0; }
    .shell-sub  { font-size: 11px; color: #555; }
    .shell-body {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .shell-spinner {
      width: 30px; height: 30px; border: 2px solid #1e1e1e;
      border-top-color: #c9a84c; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shell-status { font-size: 12px; color: #444; }
  </style>
</head>
<body>

<div id="cms-shell">
  <div class="shell-bar">
    <div class="shell-logo">OJ</div>
    <div>
      <div class="shell-name">OMODA JAECOO Palembang</div>
      <div class="shell-sub">Admin Panel</div>
    </div>
  </div>
  <div class="shell-body">
    <div class="shell-spinner"></div>
    <div class="shell-status">Memuat CMS…</div>
  </div>
</div>

<script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>

<script>
(function() {
  'use strict';

  var MOBILE = window.matchMedia('(max-width: 1023px)');

  // ── 1. Sembunyikan shell setelah Decap mount ──────────────
  var attempts = 0;
  var shellTimer = setInterval(function() {
    attempts++;
    var root = document.getElementById('nc-root');
    if ((root && root.children.length > 0) || attempts > 160) {
      clearInterval(shellTimer);
      var shell = document.getElementById('cms-shell');
      if (shell) shell.classList.add('hidden');
    }
  }, 50);

  // ── 2. Inject <style> mobile fix ─────────────────────────
  // Lebih kuat dari CSS file karena dijalankan setelah Decap mount
  // dan menggunakan !important pada selector yang lebih spesifik.
  function injectMobileFix() {
    if (!MOBILE.matches) return;

    var st = document.getElementById('cms-mobile-js-fix');
    if (!st) {
      st = document.createElement('style');
      st.id = 'cms-mobile-js-fix';
      document.head.appendChild(st);
    }

    st.textContent = [

      /* ── Global ── */
      'html,body{overflow-x:hidden!important;width:100%!important;max-width:100vw!important;}',
      '#nc-root,#nc-root>div{overflow-x:hidden!important;max-width:100vw!important;width:100%!important;}',

      /* ── App layout: paksa column (sidebar di atas, konten di bawah) ── */
      /* Decap biasanya pakai flex row untuk sidebar+main. Kita balik jadi column. */
      '#nc-root>div>div{display:flex!important;flex-direction:column!important;width:100%!important;min-height:100vh!important;}',

      /* ── Semua div langsung di bawah nc-root: lebar penuh ── */
      '#nc-root *{max-width:100vw!important;min-width:0!important;}',

      /* ── Sidebar / nav ── */
      /* Kita beri max-height agar tidak makan seluruh layar */
      '[class*="Sidebar"],[class*="sidebar"]{' +
        'width:100%!important;max-width:100vw!important;' +
        'flex-direction:row!important;flex-wrap:wrap!important;' +
        'max-height:none!important;}',

      /* Nav list — tampilkan horizontal scroll jika banyak item */
      '[class*="Nav"],[class*="NavList"],[class*="navList"]{' +
        'display:flex!important;flex-direction:row!important;' +
        'overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;' +
        'width:100%!important;gap:0!important;padding:0!important;' +
        'scrollbar-width:none!important;}',
      '[class*="Nav"]::-webkit-scrollbar{display:none!important;}',

      /* Nav item — compact pill */
      '[class*="NavLink"],[class*="navLink"],[class*="Nav"] a{' +
        'white-space:nowrap!important;flex-shrink:0!important;' +
        'padding:8px 14px!important;font-size:13px!important;' +
        'min-height:42px!important;display:flex!important;align-items:center!important;}',

      /* ── Main content area ── */
      '[class*="Page"],[class*="CollectionPage"],[class*="EditorContainer"],' +
      '[class*="MainView"],[class*="Content"]{' +
        'width:100%!important;max-width:100vw!important;' +
        'min-width:0!important;overflow-x:hidden!important;flex:1!important;}',

      /* ── Split pane (editor) ── */
      '.SplitPane{position:relative!important;height:auto!important;' +
        'display:flex!important;flex-direction:column!important;}',
      '.SplitPane>.Pane1{width:100%!important;height:auto!important;flex:1!important;}',
      '.SplitPane>.Pane2{display:none!important;width:0!important;overflow:hidden!important;}',
      '.SplitPane>.Resizer{display:none!important;}',
      '[class*="PreviewPane"],[class*="previewPane"]{display:none!important;width:0!important;}',
      '[class*="ControlPane"],[class*="controlPane"]{width:100%!important;max-width:100%!important;}',

      /* ── Form ── */
      'input,textarea,select{font-size:14px!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;}',

      /* ── Image preview ── */
      '[class*="ImagePreview"],[class*="imagePreview"],[class*="ImageWrapper"],[class*="imageWrapper"]{' +
        'max-height:200px!important;width:100%!important;display:flex!important;' +
        'align-items:center!important;justify-content:center!important;' +
        'overflow:hidden!important;background:#f0f0f0!important;}',
      '[class*="ImagePreview"] img,[class*="imagePreview"] img,' +
      '[class*="ImageWrapper"] img,[class*="imageWrapper"] img{' +
        'max-height:200px!important;width:auto!important;max-width:100%!important;' +
        'object-fit:contain!important;}',

      /* ── Modal ── */
      '[class*="Modal"],[class*="modal"]{' +
        'width:100vw!important;max-width:100vw!important;' +
        'left:0!important;right:0!important;box-sizing:border-box!important;}',

    ].join('\n');
  }

  injectMobileFix();
  setTimeout(injectMobileFix, 500);
  setTimeout(injectMobileFix, 1500);
  setTimeout(injectMobileFix, 3000);

  // ── 3. Observer: patch inline style dari Decap/SplitPane ──
  function patchNode(node) {
    if (!MOBILE.matches || !node || node.nodeType !== 1) return;
    var cl = node.classList;
    if (!cl) return;

    if (cl.contains('Pane1')) {
      node.style.setProperty('width',  '100%',  'important');
      node.style.setProperty('height', 'auto',   'important');
      node.style.setProperty('flex',   '1',       'important');
    }
    if (cl.contains('Pane2') || cl.contains('Resizer')) {
      node.style.setProperty('display', 'none', 'important');
      node.style.setProperty('width',   '0',    'important');
    }
    if (cl.contains('SplitPane')) {
      node.style.setProperty('position', 'relative', 'important');
      node.style.setProperty('height',   'auto',      'important');
    }
  }

  var observer = new MutationObserver(function(mutations) {
    if (!MOBILE.matches) return;
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(n) {
        patchNode(n);
        if (n.querySelectorAll) {
          n.querySelectorAll('.Pane1,.Pane2,.Resizer,.SplitPane').forEach(patchNode);
        }
      });
      if (m.type === 'attributes') patchNode(m.target);
    });
  });

  document.addEventListener('DOMContentLoaded', function() {
    observer.observe(document.body || document.documentElement, {
      childList: true, subtree: true,
      attributes: true, attributeFilter: ['style','class']
    });
  });

  // ── 4. Toggle preview saat buka editor ───────────────────
  var lastUrl = '', toggled = false;
  setInterval(function() {
    var url = location.href;
    if (url !== lastUrl) { lastUrl = url; toggled = false; }
    if (!toggled && MOBILE.matches && (url.includes('/edit/') || url.includes('/new'))) {
      setTimeout(function() {
        document.querySelectorAll('button').forEach(function(b) {
          var lbl = (b.getAttribute('aria-label') || b.title || '').toLowerCase();
          if (lbl.includes('toggle') || lbl.includes('preview')) {
            var p2 = document.querySelector('.Pane2');
            if (p2 && getComputedStyle(p2).display !== 'none') b.click();
          }
        });
        toggled = true;
      }, 700);
    }
  }, 300);

})();
</script>

</body>
</html>
