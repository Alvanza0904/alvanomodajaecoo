<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Admin — OMODA JAECOO Palembang</title>
  <link rel="stylesheet" href="./cms-mobile.css?v=mobile-v2">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
  <script>
    /* Re-apply the mobile stylesheet after Decap mounts. Decap injects its
       own runtime styles dynamically, so keeping this link last prevents the
       CMS from restoring the desktop split layout on iPhone. */
    (function () {
      function enforceMobileSkin() {
        if (window.innerWidth > 768) return;
        var old = document.getElementById('omoda-cms-mobile-runtime');
        if (old) old.remove();
        var style = document.createElement('style');
        style.id = 'omoda-cms-mobile-runtime';
        style.textContent = '\n' +
          '@media (max-width:768px){' +
          '#nc-root,#nc-root>div{width:100vw!important;max-width:100vw!important;min-width:0!important;overflow-x:hidden!important}' +
          '#nc-root [class*="SplitPane"],#nc-root [class*="splitPane"]{width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;min-height:0!important;display:flex!important;flex-direction:column!important}' +
          '#nc-root [class*="Pane1"],#nc-root [class*="Pane2"],#nc-root [class*="pane1"],#nc-root [class*="pane2"]{position:relative!important;inset:auto!important;width:100%!important;max-width:100%!important;min-width:0!important;flex:0 0 auto!important;height:auto!important;min-height:0!important;overflow:visible!important}' +
          '#nc-root [class*="Pane"],#nc-root [class*="pane"]{min-width:0!important;max-width:100%!important}' +
          '#nc-root [class*="ControlPane"],#nc-root [class*="EditorContainer"],#nc-root [class*="ControlContainer"],#nc-root [class*="Field"]{width:100%!important;max-width:100%!important;min-width:0!important}' +
          'input:not([type="checkbox"]):not([type="radio"]),textarea,select{max-width:100%!important;min-width:0!important}' +
          '}';
        document.head.appendChild(style);
      }
      setTimeout(enforceMobileSkin, 300);
      setTimeout(enforceMobileSkin, 1200);
      window.addEventListener('resize', enforceMobileSkin);
    })();
  </script>
</body>
</html>
