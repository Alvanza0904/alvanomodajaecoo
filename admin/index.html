<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS — OMODA JAECOO Palembang</title>
  <style>
    /* Hide preview, force editor */
    [class*="PreviewPane"],
    [class*="StyledPreviewContent"],
    [class*="EditorPreviewPane"],
    [class*="PreviewContainer"] {
      display: none !important;
    }
    [class*="ControlPane"],
    [class*="EditorControlPane"] {
      width: 100% !important;
      min-width: 100% !important;
      left: 0 !important;
      position: relative !important;
    }
    .Pane2 { display: none !important; }
    .Pane1 {
      width: 100% !important;
      position: relative !important;
      height: auto !important;
    }
    .SplitPane {
      position: relative !important;
      height: auto !important;
      overflow: visible !important;
    }
    .Resizer { display: none !important; }
    input, textarea, select {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@2.10.192/dist/decap-cms.js"></script>
</body>
</html>
