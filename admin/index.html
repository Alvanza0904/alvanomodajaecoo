<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Admin — OMODA JAECOO Palembang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/cms-mobile.css?v=4" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; width: 100%; }

    /* Shell loading */
    #cms-shell {
      position: fixed; inset: 0; background: #0a0a0a;
      display: flex; flex-direction: column; z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #cms-shell.hidden { opacity: 0; pointer-events: none; z-index: -1; }
    .shell-bar {
      height: 48px; background: #0a0a0a; border-bottom: 1px solid #1e1e1e;
      display: flex; align-items: center; gap: 10px; padding: 0 16px; flex-shrink: 0;
    }
    .shell-logo {
      width: 24px; height: 24px; border-radius: 5px;
      background: linear-gradient(135deg,#c9a84c,#e8c97a);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #0a0a0a; flex-shrink: 0;
    }
    .shell-name { font-size: 13px; font-weight: 600; color: #f0f0f0; }
    .shell-sub  { font-size: 11px; color: #555; }
    .shell-body {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .shell-spinner {
      width: 30px; height: 30px; border: 2px solid #1e1e1e;
      border-top-color: #c9a84c; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shell-status { font-size: 12px; color: #444; }
  </style>
</head>
<body>

<div id="cms-shell">
  <div class="shell-bar">
    <div class="shell-logo">OJ</div>
    <div>
      <div class="shell-name">OMODA JAECOO Palembang</div>
      <div class="shell-sub">Admin Panel</div>
    </div>
  </div>
  <div class="shell-body">
    <div class="shell-spinner"></div>
    <div class="shell-status">Memuat CMS…</div>
  </div>
</div>

<script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>

<script>
(function () {
  'use strict';

  var IS_MOBILE = window.innerWidth < 1024;

  /* ── 1. Hide shell ─────────────────────────────────────── */
  var shellTries = 0;
  var shellTimer = setInterval(function () {
    shellTries++;
    var root = document.getElementById('nc-root');
    if ((root && root.children.length > 0) || shellTries > 160) {
      clearInterval(shellTimer);
      var s = document.getElementById('cms-shell');
      if (s) s.classList.add('hidden');
    }
  }, 50);

  if (!IS_MOBILE) return; // Desktop: tidak perlu fix

  /* ── 2. Core fixer — scan seluruh DOM, perbaiki layout ── */
  /*
   * Strategi:
   * Decap merender struktur kira-kira:
   *   #nc-root
   *     div (app root)
   *       header
   *       div (main wrapper) ← ini yang flex-row, lebar sidebar ~220-280px
   *         nav/div (sidebar)
   *         div (content)
   *
   * Kita tidak tahu class-nya, jadi kita:
   * 1. Cari elemen yang punya dua anak dengan lebar < 60% viewport (= side by side)
   * 2. Paksa parent jadi flex-column
   * 3. Paksa kedua anak jadi width: 100%
   * 4. Hapus/override semua inline width yang bukan 100%
   */

  var VW = window.innerWidth;

  function fixEl(el) {
    if (!el || el.nodeType !== 1) return;

    var cs = window.getComputedStyle(el);
    var w  = el.offsetWidth;

    // Elemen yang lebarnya < 70% viewport kemungkinan sidebar atau panel
    // Paksa jadi full width
    if (w > 0 && w < VW * 0.85) {
      el.style.setProperty('width',     '100%',      'important');
      el.style.setProperty('max-width', '100vw',     'important');
      el.style.setProperty('min-width', '0',         'important');
      el.style.setProperty('flex',      '1 1 100%',  'important');
    }

    // Elemen yang display flex/grid dengan row direction → paksa column
    var display = cs.display;
    var flexDir = cs.flexDirection;
    if ((display === 'flex' || display === 'inline-flex') &&
        flexDir !== 'column' && flexDir !== 'column-reverse') {
      // Cek apakah anak-anaknya side by side (keduanya < VW)
      var children = Array.prototype.slice.call(el.children);
      var sideBySide = children.length >= 2 && children.every(function(c) {
        return c.offsetWidth > 0 && c.offsetWidth < VW * 0.9;
      });
      if (sideBySide) {
        el.style.setProperty('flex-direction', 'column', 'important');
        el.style.setProperty('width',          '100%',   'important');
        children.forEach(function(c) {
          c.style.setProperty('width',     '100%',     'important');
          c.style.setProperty('max-width', '100vw',    'important');
          c.style.setProperty('min-width', '0',        'important');
          c.style.setProperty('flex',      '1 1 100%', 'important');
          c.style.setProperty('position',  'relative', 'important');
          c.style.setProperty('height',    'auto',     'important');
        });
      }
    }

    // Grid display → paksa 1 kolom
    if (display === 'grid') {
      var cols = cs.gridTemplateColumns;
      // Jika lebih dari 1 kolom dan bukan kolom tunggal
      if (cols && cols.split(' ').filter(function(x){return x.trim();}).length > 1) {
        // Hanya fix jika ini bukan media grid (gambar-gambar kecil)
        // Media grid biasanya punya banyak kolom sama ukuran
        var firstChild = el.firstElementChild;
        if (firstChild && firstChild.offsetWidth > VW * 0.3) {
          el.style.setProperty('grid-template-columns', '1fr', 'important');
        }
      }
    }

    // Inline width yang tidak 100% → override
    var inlineW = el.style.width;
    if (inlineW && inlineW !== '100%' && inlineW !== 'auto' &&
        inlineW !== '' && !inlineW.endsWith('px') === false) {
      // Hanya override jika bukan pixel kecil (tombol, icon)
      var px = parseInt(inlineW);
      if (!isNaN(px) && px > 100) {
        el.style.setProperty('width', '100%', 'important');
      }
    }
    // Inline width dalam % yang bukan 100%
    if (inlineW && inlineW.endsWith('%') && inlineW !== '100%') {
      el.style.setProperty('width', '100%', 'important');
    }
  }

  function fixSplitPane() {
    // SplitPane spesifik — pakai class name yang diketahui
    var pane1 = document.querySelector('.Pane1');
    var pane2 = document.querySelector('.Pane2');
    var resizer = document.querySelector('.Resizer');
    var split = document.querySelector('.SplitPane');

    if (split) {
      split.style.setProperty('position', 'relative', 'important');
      split.style.setProperty('height', 'auto', 'important');
      split.style.setProperty('display', 'flex', 'important');
      split.style.setProperty('flex-direction', 'column', 'important');
    }
    if (pane1) {
      pane1.style.setProperty('width', '100%', 'important');
      pane1.style.setProperty('height', 'auto', 'important');
      pane1.style.setProperty('position', 'relative', 'important');
    }
    if (pane2) {
      pane2.style.setProperty('display', 'none', 'important');
      pane2.style.setProperty('width', '0', 'important');
    }
    if (resizer) {
      resizer.style.setProperty('display', 'none', 'important');
    }
  }

  function runFix() {
    if (!IS_MOBILE) return;

    // Fix nc-root dan keturunan langsung dulu
    var root = document.getElementById('nc-root');
    if (!root) return;

    // Scan semua elemen di DOM
    var all = root.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      fixEl(all[i]);
    }

    // SplitPane khusus
    fixSplitPane();

    // Override umum: pastikan tidak ada elemen yang lebih lebar dari viewport
    var tooWide = root.querySelectorAll('*');
    for (var j = 0; j < tooWide.length; j++) {
      var el = tooWide[j];
      if (el.scrollWidth > VW + 5) {
        el.style.setProperty('max-width', '100vw', 'important');
        el.style.setProperty('overflow-x', 'hidden', 'important');
      }
    }
  }

  // Jalankan beberapa kali setelah Decap mount
  setTimeout(runFix, 600);
  setTimeout(runFix, 1200);
  setTimeout(runFix, 2500);

  // ── 3. Observer untuk perubahan DOM ──────────────────────
  var fixDebounce = null;
  var observer = new MutationObserver(function (mutations) {
    if (!IS_MOBILE) return;
    clearTimeout(fixDebounce);
    fixDebounce = setTimeout(function () {
      fixSplitPane();
      // Fix elemen yang baru ditambahkan saja (lebih efisien)
      mutations.forEach(function (m) {
        m.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) {
            fixEl(n);
            if (n.querySelectorAll) {
              var kids = n.querySelectorAll('*');
              for (var k = 0; k < kids.length; k++) fixEl(kids[k]);
            }
          }
        });
        if (m.type === 'attributes') fixEl(m.target);
      });
    }, 100);
  });

  var waitForBody = setInterval(function () {
    if (document.body) {
      clearInterval(waitForBody);
      observer.observe(document.body, {
        childList: true, subtree: true,
        attributes: true, attributeFilter: ['style', 'class']
      });
    }
  }, 100);

  // ── 4. Re-run saat navigasi (hash change) ────────────────
  window.addEventListener('hashchange', function () {
    setTimeout(runFix, 400);
    setTimeout(runFix, 900);
  });

  // ── 5. Toggle preview pane saat masuk editor ─────────────
  var lastUrl = '', toggled = false;
  setInterval(function () {
    var url = location.href;
    if (url !== lastUrl) { lastUrl = url; toggled = false; }
    if (!toggled && (url.includes('/edit/') || url.includes('/new'))) {
      setTimeout(function () {
        document.querySelectorAll('button').forEach(function (b) {
          var lbl = (b.getAttribute('aria-label') || b.title || '').toLowerCase();
          if (lbl.includes('toggle') || lbl.includes('preview')) {
            var p2 = document.querySelector('.Pane2');
            if (p2 && getComputedStyle(p2).display !== 'none') b.click();
          }
        });
        toggled = true;
        setTimeout(runFix, 300);
      }, 700);
    }
  }, 300);

})();
</script>

</body>
</html>
