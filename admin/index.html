<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CMS — OMODA JAECOO Palembang</title>
  <style>
    /* Force semua elemen masuk layar */
    html, body {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Root CMS */
    #nc-root, #nc-root > div {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
    }

    /* Semua div, section, main */
    * {
      max-width: 100vw !important;
      box-sizing: border-box !important;
    }

    /* Split pane fix */
    .Pane2, .Resizer { display: none !important; }
    .Pane1 { width: 100% !important; position: static !important; }
    .SplitPane { position: static !important; height: auto !important; overflow: visible !important; }

    /* Toolbar & header — no fixed width */
    [class*="Toolbar"],
    [class*="AppBar"],
    [class*="Header"],
    [class*="Nav"] {
      width: 100% !important;
      max-width: 100vw !important;
      overflow: hidden !important;
    }

    /* Media library */
    [class*="MediaLibrary"],
    [class*="mediaLibrary"],
    [class*="Modal"],
    [class*="Overlay"] {
      width: 100vw !important;
      max-width: 100vw !important;
      left: 0 !important;
      right: 0 !important;
      padding: 8px !important;
      overflow-x: hidden !important;
    }

    /* Grid gambar di media library — 2 kolom */
    [class*="CardGrid"],
    [class*="cardGrid"],
    [class*="Grid"] {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 8px !important;
      width: 100% !important;
      padding: 8px !important;
    }

    /* Card gambar */
    [class*="CardImage"],
    [class*="Card"] {
      width: 100% !important;
      max-width: 100% !important;
    }

    [class*="CardImage"] img,
    [class*="Card"] img {
      width: 100% !important;
      height: 120px !important;
      object-fit: cover !important;
    }

    /* Form fields */
    input, textarea, select {
      font-size: 16px !important;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 44px !important;
      padding: 10px 12px !important;
      -webkit-appearance: none !important;
    }

    textarea { min-height: 100px !important; }

    button {
      min-height: 44px !important;
      font-size: 15px !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
  <script>
    var lastUrl = '';
    setInterval(function() {
      var url = location.href;
      if (url !== lastUrl) {
        lastUrl = url;
        if (url.includes('/edit/') || url.includes('/new')) {
          setTimeout(function() {
            document.querySelectorAll('button').forEach(function(b) {
              var label = b.getAttribute('aria-label') || '';
              if (label.toLowerCase().includes('toggle')) b.click();
            });
          }, 800);
        }
      }
    }, 300);
  </script>
</body>
</html>
