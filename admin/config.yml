backend:
  name: github
  repo: Alvanza0904/alvanomodajaecoo
  branch: main
  base_url: https://decap-proxy.freftialvanza0904.workers.dev
  auth_endpoint: /auth

media_folder: assets/images
public_folder: /assets/images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:

  - name: models
    label: "🚗 Harga OTR Model"
    folder: content/models
    create: false
    slug: "{{slug}}"
    extension: yml
    format: yaml
    identifier_field: name
    fields:
      - { label: "Nama Model", name: name, widget: string, required: true }
      - { label: "Slug", name: slug, widget: string, required: true }
      - label: "Varian"
        name: variants
        widget: list
        required: false
        fields:
          - { label: "Nama Varian", name: name, widget: string, required: true }
          - { label: "Slug Varian", name: slug, widget: string, required: true }
          - { label: "Harga OTR (Rp)", name: otr, widget: number, value_type: "int", required: true, hint: "Masukkan angka tanpa titik. Contoh: 354900000" }
      - { label: "Harga OTR (Rp)", name: otr, widget: number, value_type: "int", required: false, hint: "Untuk model tanpa varian. Masukkan angka tanpa titik. Contoh: 354900000" }

  - name: promo
    label: "🎁 Promo"
    folder: promo
    create: true
    slug: "{{slug}}"
    fields:

      # ── DETAIL PROMO ──
      - { label: "Judul Promo", name: title, widget: string, hint: "Contoh: Promo Lebaran JAECOO J5 EV" }
      - { label: "Slug (URL)", name: slug, widget: string, hint: "Contoh: promo-lebaran-jaecoo-j5-ev (huruf kecil, pakai tanda hubung)" }
      - { label: "Ringkasan", name: excerpt, widget: text, required: false, hint: "Kalimat singkat tentang promo ini (maks 160 karakter)" }

      # ── MODEL ──
      - label: "Model"
        name: model
        widget: select
        options: ["JAECOO J5 EV", "JAECOO J7 SHS", "JAECOO J7 SHS SIVP", "JAECOO J8 ARDIS SHS", "OMODA O4", "Semua Model"]
        required: false
        hint: "Model kendaraan yang dipromo"
      - { label: "Nama Program Promo", name: promo_name, widget: string, required: false, hint: "Contoh: Promo Lebaran 2026, End of Year Sale" }

      # ── PERIODE ──
      - { label: "Tanggal Mulai", name: start_date, widget: datetime, required: false, hint: "Kapan promo mulai berlaku" }
      - { label: "Tanggal Berakhir", name: end_date, widget: datetime, required: false, hint: "Kapan promo berakhir. Kosongkan jika tidak ada batas waktu." }

      # ── PENAWARAN ──
      - { label: "Harga Normal", name: price, widget: string, required: false, hint: "Contoh: Rp 354.900.000" }
      - { label: "Harga Promo", name: promo_price, widget: string, required: false, hint: "Contoh: Rp 339.900.000 (isi jika ada diskon harga)" }
      - { label: "Benefit / Keuntungan", name: benefit, widget: text, required: false, hint: "Satu baris per item akan otomatis menjadi checklist" }
      - { label: "Bonus", name: bonus, widget: text, required: false, hint: "Bonus aksesori atau gift. Satu baris per item." }
      - { label: "DP Mulai", name: dp, widget: string, required: false, hint: "Contoh: Rp 35.000.000" }
      - { label: "Cicilan Per Bulan", name: installment, widget: string, required: false, hint: "Contoh: Rp 5.900.000/bulan" }
      - { label: "Tenor", name: tenor, widget: string, required: false, hint: "Contoh: 48 bulan, 60 bulan" }

      # ── MEDIA ──
      - { label: "Gambar Promo", name: featured_image, widget: image, required: false }
      - { label: "Alt Text Gambar", name: image_alt, widget: string, required: false, hint: "Deskripsi gambar untuk SEO dan aksesibilitas" }

      # ── SYARAT ──
      - { label: "Syarat & Ketentuan", name: terms, widget: text, required: false, hint: "Syarat dan ketentuan promo. Satu baris per syarat." }

      # ── WHATSAPP ──
      - { label: "Pesan WhatsApp Custom", name: whatsapp_message, widget: text, required: false, hint: "Kosongkan untuk menggunakan pesan otomatis sesuai model & nama promo" }

      # ── SEO ──
      - { label: "SEO Title", name: seo_title, widget: string, required: false, hint: "Judul halaman untuk mesin pencari. Maks 60 karakter." }
      - { label: "SEO Description", name: seo_description, widget: text, required: false, hint: "Deskripsi untuk mesin pencari. Maks 160 karakter." }

      # ── PUBLISHING ──
      - { label: "Publish", name: published, widget: boolean, default: true, hint: "Aktifkan untuk mempublish promo ini" }
      - { label: "Tampilkan di Homepage", name: featured, widget: boolean, default: false, hint: "Aktifkan agar promo muncul di section Promo Aktif homepage" }

  - name: berita
    label: "📰 Berita"
    folder: berita
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Judul, name: title, widget: string, hint: "Judul artikel saja (bukan seluruh isi). Contoh: Harga JAECOO Berpotensi Naik Oktober 2026", pattern: [".{8,110}", "Judul harus 8-110 karakter"] }
      - { label: "Slug (URL)", name: slug, widget: string, required: false, hint: "Huruf kecil, pakai tanda hubung. Contoh: harga-jaecoo-berpotensi-naik-oktober-2026. Kosongkan untuk otomatis dari judul." }
      - { label: Tanggal, name: date, widget: datetime }
      - { label: Kategori, name: category, widget: select, options: ["Info Terbaru", "Harga & Launching", "Perbandingan Model"], default: "Info Terbaru" }
      - { label: Deskripsi Singkat, name: description, widget: string, required: false }
      - { label: Focus Keyword, name: focus_keyword, widget: string, required: false }
      - { label: Alt Text Gambar, name: image_alt, widget: string, required: false }
      - { label: Caption Gambar, name: image_caption, widget: string, required: false }
      - { label: Gambar Utama, name: image, widget: image, required: false }
      - { label: Tampilkan CTA Simulasi Kredit, name: show_kredit_cta, widget: boolean, default: false }
      - { label: Konten, name: body, widget: markdown }

  - name: foto_homepage
    label: "🏠 Homepage"
    folder: content/homepage
    create: false
    summary: "{{section}} · {{title}}"
    identifier_field: title
    media_folder: /assets/images/cms/homepage
    public_folder: /assets/images/cms/homepage
    sortable_fields: [section, title]
    view_filters:
      - { label: "Hero Slide", field: section, pattern: "^Hero$" }
      - { label: "Delivery", field: section, pattern: "^Delivery$" }
      - { label: "Model Lineup", field: section, pattern: "^Lineup$" }
      - { label: "Recognition", field: section, pattern: "^Recognition$" }
      - { label: "Sales / Dealer", field: section, pattern: "^Dealer$" }
    fields:
      - { label: Nama Section, name: title, widget: string }
      - { label: Kelompok, name: section, widget: select, options: ["Hero", "Delivery", "Lineup", "Recognition", "Dealer"] }
      - { label: Gambar, name: image, widget: image, hint: "Ganti foto lalu Save. HTML diperbarui otomatis. Jangan ubah nama file Markdown." }
      - { label: Alt Text, name: alt, widget: string, required: false }

  - name: foto_j5
    label: "🚗 JAECOO J5"
    folder: content/jaecoo-j5
    create: false
    summary: "{{section}} · {{title}}"
    identifier_field: title
    media_folder: /assets/images/cms/jaecoo-j5
    public_folder: /assets/images/cms/jaecoo-j5
    sortable_fields: [section, title]
    view_filters:
      - { label: "Hero", field: section, pattern: "^Hero$" }
      - { label: "Eksterior", field: section, pattern: "^Eksterior$" }
      - { label: "Interior", field: section, pattern: "^Interior$" }
      - { label: "Warna", field: section, pattern: "^Warna$" }
      - { label: "Teknologi", field: section, pattern: "^Teknologi$" }
      - { label: "Galeri", field: section, pattern: "^Galeri$" }
    fields:
      - { label: Nama Section, name: title, widget: string }
      - { label: Kelompok, name: section, widget: select, options: ["Hero", "Eksterior", "Interior", "Warna", "Teknologi", "Galeri"] }
      - { label: Gambar, name: image, widget: image, hint: "Kunci CMS tetap (nama file .md). Yang berubah hanya path gambar." }
      - { label: Alt Text, name: alt, widget: string, required: false }

  - name: foto_j7
    label: "🚙 JAECOO J7"
    folder: content/jaecoo-j7
    create: false
    summary: "{{section}} · {{title}}"
    identifier_field: title
    media_folder: /assets/images/cms/jaecoo-j7
    public_folder: /assets/images/cms/jaecoo-j7
    sortable_fields: [section, title]
    view_filters:
      - { label: "Hero", field: section, pattern: "^Hero$" }
      - { label: "Eksterior", field: section, pattern: "^Eksterior$" }
      - { label: "Interior", field: section, pattern: "^Interior$" }
      - { label: "Warna", field: section, pattern: "^Warna$" }
      - { label: "Teknologi", field: section, pattern: "^Teknologi$" }
      - { label: "Keselamatan", field: section, pattern: "^Keselamatan$" }
      - { label: "Galeri", field: section, pattern: "^Galeri$" }
      - { label: "SIVP", field: section, pattern: "^SIVP$" }
    fields:
      - { label: Nama Section, name: title, widget: string }
      - { label: Kelompok, name: section, widget: select, options: ["Hero", "Eksterior", "Interior", "Warna", "Teknologi", "Keselamatan", "Galeri", "SIVP"] }
      - { label: Gambar, name: image, widget: image, hint: "Kunci CMS tetap (nama file .md). Yang berubah hanya path gambar." }
      - { label: Alt Text, name: alt, widget: string, required: false }

  - name: foto_j8
    label: "🏔️ JAECOO J8"
    folder: content/jaecoo-j8
    create: false
    summary: "{{section}} · {{title}}"
    identifier_field: title
    media_folder: /assets/images/cms/jaecoo-j8
    public_folder: /assets/images/cms/jaecoo-j8
    sortable_fields: [section, title]
    view_filters:
      - { label: "Hero", field: section, pattern: "^Hero$" }
      - { label: "Eksterior", field: section, pattern: "^Eksterior$" }
      - { label: "Interior", field: section, pattern: "^Interior$" }
      - { label: "Teknologi", field: section, pattern: "^Teknologi$" }
      - { label: "ARDIS", field: section, pattern: "^ARDIS$" }
      - { label: "Warna", field: section, pattern: "^Warna$" }
      - { label: "Galeri", field: section, pattern: "^Galeri$" }
    fields:
      - { label: Nama Section, name: title, widget: string }
      - { label: Kelompok, name: section, widget: select, options: ["Hero", "Eksterior", "Interior", "Teknologi", "ARDIS", "Warna", "Galeri"] }
      - { label: Gambar, name: image, widget: image, hint: "Kunci CMS tetap (nama file .md). Yang berubah hanya path gambar." }
      - { label: Alt Text, name: alt, widget: string, required: false }

  - name: foto_o4
    label: "⚡ OMODA O4"
    folder: content/omoda-o4
    create: false
    summary: "{{section}} · {{title}}"
    identifier_field: title
    media_folder: /assets/images/cms/omoda-o4
    public_folder: /assets/images/cms/omoda-o4
    sortable_fields: [section, title]
    view_filters:
      - { label: "Hero", field: section, pattern: "^Hero$" }
      - { label: "Eksterior", field: section, pattern: "^Eksterior$" }
      - { label: "Interior", field: section, pattern: "^Interior$" }
      - { label: "Teknologi", field: section, pattern: "^Teknologi$" }
      - { label: "Keselamatan", field: section, pattern: "^Keselamatan$" }
      - { label: "Warna", field: section, pattern: "^Warna$" }
      - { label: "Galeri", field: section, pattern: "^Galeri$" }
      - { label: "Performa", field: section, pattern: "^Performa$" }
    fields:
      - { label: Nama Section, name: title, widget: string }
      - { label: Kelompok, name: section, widget: select, options: ["Hero", "Eksterior", "Interior", "Teknologi", "Keselamatan", "Warna", "Galeri", "Performa"] }
      - { label: Gambar, name: image, widget: image, hint: "Kunci CMS tetap (nama file .md). Yang berubah hanya path gambar." }
      - { label: Alt Text, name: alt, widget: string, required: false }
