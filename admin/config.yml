backend:
  name: github
  repo: Alvanza0904/alvanomodajaecoo
  branch: main
  base_url: https://decap-proxy.freftialvanza0904.workers.dev
  auth_endpoint: /auth

media_folder: assets/images
public_folder: /assets/images

# ──────────────────────────────────────────────
# COLLECTIONS
# ──────────────────────────────────────────────
collections:

  # ============================================================
  # BERITA — koleksi existing, tidak diubah
  # ============================================================
  - name: berita
    label: "📰 Berita"
    label_singular: Artikel
    folder: berita
    create: true
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Tanggal, name: date, widget: datetime }
      - { label: Kategori, name: category, widget: select, options: ["Info Terbaru", "Harga & Launching", "Perbandingan Model"], default: "Info Terbaru" }
      - { label: Deskripsi Singkat, name: description, widget: string, hint: "Maks 160 karakter. Jika dikosongkan, generator membuat deskripsi otomatis dari isi artikel.", required: false }
      - { label: Focus Keyword, name: focus_keyword, widget: string, hint: "Opsional. Contoh: harga JAECOO J5 Palembang. Generator hanya menebalkan 1 kemunculan yang relevan.", required: false }
      - { label: Alt Text Gambar, name: image_alt, widget: string, hint: "Opsional. Jika kosong, dibuat otomatis dari judul artikel.", required: false }
      - { label: Caption Gambar, name: image_caption, widget: string, required: false }
      - { label: Gambar Utama, name: image, widget: image, hint: "Upload gambar artikel. Ukuran ideal 1200x675px.", required: false }
      - { label: Tampilkan CTA Simulasi Kredit, name: show_kredit_cta, widget: boolean, default: false, hint: "Aktifkan untuk menampilkan tombol simulasi kredit di artikel." }
      - { label: Konten, name: body, widget: markdown }

  # ============================================================
  # FOTO WEBSITE — koleksi baru untuk mengelola gambar
  # ============================================================

  # ──────────────────────────────────────────────
