                  - { label: "Alt Text", name: alt, widget: string, hint: "Deskripsi gambar untuk SEO dan aksesibilitas." }
                  - { label: "Judul Kecil (eyebrow)", name: title, widget: string, hint: "Contoh: OMODA O4 EV · PALEMBANG" }
                  - { label: "Heading Utama", name: heading, widget: string, hint: "Judul besar. Gunakan <br/> untuk baris baru." }
                  - { label: "Deskripsi", name: description, widget: string }
