name: Generate News

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "berita/**"
      - "scripts/generate-news.js"
      - "package.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate news HTML
        run: |
          echo "=== Node ==="
          node --version
          echo "=== Files ==="
          ls -la
          echo "=== Berita ==="
          find berita -maxdepth 2 -type f -print || true
          echo "=== Script ==="
          node scripts/generate-news.js

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add berita/
          git diff --cached --quiet || git commit -m "Generate news HTML"
          git push
