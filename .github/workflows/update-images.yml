name: Update Images from CMS

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
  workflow_dispatch:

concurrency:
  group: cms-image-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan script update gambar
        run: python update-images.py

      - name: Commit & push perubahan HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # HTML, plus file gambar yang script pindahkan dari folder content
          # ke path publik. Jangan ikut commit script, config, atau Markdown.
          while IFS= read -r file; do
            case "$file" in
              *.html) ;;
              assets/images/cms/*) ;;
              content/*/assets/*) ;;
              *) git reset HEAD -- "$file" ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan HTML, skip commit."
          else
            git commit -m "chore: auto-update gambar dari CMS [skip ci]"
            git pull --rebase origin main
            git push
          fi
